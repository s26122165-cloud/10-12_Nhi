<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>柔和馬卡龍風格 - 自定義迷因產生器</title>

  <!-- Google Fonts: 引入 Noto Sans TC (思源黑體繁體中文) 與 Anton (經典迷因英文字體) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

  <!-- CDN html2canvas: 用於將 HTML 區塊轉為 PNG 圖片並下載 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* =========================================================
       1. 全局背景與字型樣式 (Soft Pastel Style)
       ========================================================= */
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: linear-gradient(135deg, #fdfbf7 0%, #f5efe6 50%, #fceade 100%);
      color: #5a5266;
      min-height: 100vh;
    }

    /* 迷因專用字型（中文與英文皆能有厚實感） */
    .font-meme {
      font-family: 'Anton', 'Noto Sans TC', sans-serif;
      font-weight: 900;
    }

    /* 多重文字陰影（描邊效果）：確保文字在任何底圖上都清晰可見 */
    .meme-text-shadow {
      text-shadow:
        2px 2px 0 var(--stroke-color, #000000),
       -2px -2px 0 var(--stroke-color, #000000),
        2px -2px 0 var(--stroke-color, #000000),
       -2px 2px 0 var(--stroke-color, #000000),
        0px 2px 0 var(--stroke-color, #000000),
        0px -2px 0 var(--stroke-color, #000000),
        2px 0px 0 var(--stroke-color, #000000),
       -2px 0px 0 var(--stroke-color, #000000),
        0px 4px 10px rgba(0,0,0,0.35);
    }

    /* 柔和馬卡龍卡片樣式 */
    .pastel-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 10px 30px -5px rgba(230, 200, 210, 0.4), 0 4px 12px rgba(0, 0, 0, 0.03);
    }

    /* 柔和漸層按鈕 */
    .btn-pastel {
      background: linear-gradient(135deg, #ffb7b2 0%, #ffdac1 50%, #e2f0cb 100%);
      color: #4a3e3d;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-pastel:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 183, 178, 0.5);
    }

    /* 滑桿馬卡龍粉色調 */
    input[type=range] {
      accent-color: #ff9aa2;
    }

    /* 自訂平滑滾動條 */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #fdfbf7;
    }
    ::-webkit-scrollbar-thumb {
      background: #ffb7b2;
      border-radius: 10px;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- ==================== 頁首標題區 ==================== -->
  <header class="border-b border-pink-100 bg-white/70 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-pink-100 border border-pink-200 flex items-center justify-center text-pink-400 font-bold text-xl shadow-sm">
          🎀
        </div>
        <div>
          <h1 class="text-xl md:text-2xl font-bold tracking-wide text-slate-700 font-meme">
            馬卡龍<span class="text-pink-400">迷因產生器</span>
          </h1>
          <p class="text-[11px] text-slate-400 -mt-1 font-medium">柔和淡雅風格 • 輕鬆自訂迷因</p>
        </div>
      </div>
      <span class="text-xs px-3 py-1 rounded-full bg-pink-50 text-pink-500 font-semibold border border-pink-100 shadow-sm">
        ✨ 繁體中文版
      </span>
    </div>
  </header>

  <!-- ==================== 主內容區（RWD 響應式排版） ==================== -->
  <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- ==================== 控制面板區 (左側 / 手機端上方) ==================== -->
    <section class="lg:col-span-5 flex flex-col gap-5 p-5 md:p-6 rounded-3xl pastel-card">
      
      <div class="border-b border-pink-100 pb-3 flex items-center justify-between">
        <h2 class="text-base font-bold text-slate-700 flex items-center gap-2">
          <span>🌸</span> 控制面板
        </h2>
        <span class="text-xs text-pink-400 font-medium">即時預覽編輯</span>
      </div>

      <!-- 1. 本機圖片上傳區 (FileReader + 拖放功能) -->
      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-slate-600">1. 上傳底圖（選擇本機檔案）</label>
        <div id="drop-zone" class="border-2 border-dashed border-pink-200 hover:border-pink-300 rounded-2xl p-4 text-center cursor-pointer bg-pink-50/30 hover:bg-pink-50/70 transition-all relative group">
          <input type="file" id="image-loader" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
          <div class="space-y-1 pointer-events-none">
            <div class="w-10 h-10 mx-auto rounded-full bg-white flex items-center justify-center text-pink-400 shadow-sm group-hover:scale-110 transition-transform">
              🖼️
            </div>
            <p class="text-xs font-bold text-slate-600">點擊此處或拖放圖片至此</p>
            <p class="text-[11px] text-slate-400">支援 PNG、JPG、WEBP 格式（本機讀取，無 CORS 錯誤）</p>
          </div>
        </div>
      </div>

      <!-- 2. 雙層文字輸入框 -->
      <div class="space-y-3">
        <div>
          <label for="top-text-input" class="block text-xs font-bold text-slate-600 mb-1">2. 上方文字 (Top Text)</label>
          <input type="text" id="top-text-input" value="當你試著在週五下午完成工作" placeholder="請輸入上方文字..." 
            class="w-full bg-white/90 border border-pink-100 focus:border-pink-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 outline-none transition-all shadow-sm">
        </div>

        <div>
          <label for="bottom-text-input" class="block text-xs font-bold text-slate-600 mb-1">3. 下方文字 (Bottom Text)</label>
          <input type="text" id="bottom-text-input" value="但生活給了你滿滿的可愛能量" placeholder="請輸入下方文字..." 
            class="w-full bg-white/90 border border-pink-100 focus:border-pink-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 outline-none transition-all shadow-sm">
        </div>
      </div>

      <!-- 3. 參數滑桿控制項 -->
      <div class="space-y-3.5 pt-2 border-t border-pink-100">
        <h3 class="text-xs font-bold text-slate-600 flex items-center gap-1.5">
          <span>🎨</span> 文字大小與垂直位置微調
        </h3>

        <!-- 滑桿：字體大小 -->
        <div>
          <div class="flex justify-between text-xs text-slate-500 mb-1">
            <span>字體大小 (Font Size)</span>
            <span id="font-size-val" class="font-bold text-pink-400">38px</span>
          </div>
          <input type="range" id="font-size-slider" min="16" max="80" value="38" class="w-full h-1.5 bg-pink-100 rounded-lg cursor-pointer">
        </div>

        <!-- 滑桿：上方文字垂直位置 -->
        <div>
          <div class="flex justify-between text-xs text-slate-500 mb-1">
            <span>上方文字位置 (Top Position)</span>
            <span id="top-pos-val" class="font-bold text-pink-400">5%</span>
          </div>
          <input type="range" id="top-pos-slider" min="0" max="45" value="5" class="w-full h-2 bg-pink-100 rounded-lg cursor-pointer">
        </div>

        <!-- 滑桿：下方文字垂直位置 -->
        <div>
          <div class="flex justify-between text-xs text-slate-500 mb-1">
            <span>下方文字位置 (Bottom Position)</span>
            <span id="bottom-pos-val" class="font-bold text-pink-400">5%</span>
          </div>
          <input type="range" id="bottom-pos-slider" min="0" max="45" value="5" class="w-full h-2 bg-pink-100 rounded-lg cursor-pointer">
        </div>

        <!-- 文字與描邊色彩選擇器 -->
        <div class="grid grid-cols-2 gap-3 pt-1">
          <div class="flex items-center gap-2 bg-white/80 p-2 rounded-xl border border-pink-100">
            <input type="color" id="text-color-picker" value="#ffffff" class="w-7 h-7 rounded-lg border-0 bg-transparent cursor-pointer">
            <label for="text-color-picker" class="text-xs font-semibold text-slate-600">文字顏色</label>
          </div>
          <div class="flex items-center gap-2 bg-white/80 p-2 rounded-xl border border-pink-100">
            <input type="color" id="stroke-color-picker" value="#000000" class="w-7 h-7 rounded-lg border-0 bg-transparent cursor-pointer">
            <label for="stroke-color-picker" class="text-xs font-semibold text-slate-600">邊框顏色</label>
          </div>
        </div>
      </div>

      <!-- 4. 一鍵下載按鈕 -->
      <div class="pt-2 mt-auto">
        <button id="download-btn" class="w-full btn-pastel font-bold py-3.5 px-6 rounded-2xl flex items-center justify-center gap-2 shadow-md cursor-pointer text-sm">
          <span>💖</span>
          <span>下載迷因圖檔 (Download my-meme.png)</span>
        </button>
      </div>

    </section>

    <!-- ==================== 迷因即時預覽區 (右側 / 手機端下方) ==================== -->
    <section class="lg:col-span-7 flex flex-col items-center justify-center p-4 md:p-6 rounded-3xl pastel-card min-h-[420px]">
      
      <div class="w-full flex items-center justify-between mb-3 px-1">
        <span class="text-xs font-bold text-slate-500 flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-pink-400 animate-pulse"></span>
          即時預覽 (PREVIEW)
        </span>
        <span class="text-[11px] text-pink-400 font-medium bg-pink-50 px-2.5 py-0.5 rounded-full border border-pink-100">
          比例自動對齊
        </span>
      </div>

      <!-- 迷因畫面區域（html2canvas 截圖下載目標） -->
      <div id="meme-container" class="relative max-w-full overflow-hidden rounded-2xl shadow-xl bg-white flex items-center justify-center border border-pink-100 select-none">
        
        <!-- 預設迷因底圖 -->
        <img id="meme-image" src="https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=800&auto=format&fit=crop&q=80" alt="迷因底圖" class="max-h-[65vh] w-auto object-contain block">

        <!-- 顯示於底圖上的上方文字 -->
        <div id="top-text-display" class="absolute top-[5%] left-0 right-0 px-4 text-center font-meme text-white tracking-wide uppercase leading-tight meme-text-shadow break-words pointer-events-none" style="font-size: 38px;">
          當你試著在週五下午完成工作
        </div>

        <!-- 顯示於底圖上的下方文字 -->
        <div id="bottom-text-display" class="absolute bottom-[5%] left-0 right-0 px-4 text-center font-meme text-white tracking-wide uppercase leading-tight meme-text-shadow break-words pointer-events-none" style="font-size: 38px;">
          但生活給了你滿滿的可愛能量
        </div>

      </div>

    </section>

  </main>

  <footer class="border-t border-pink-100 bg-white/50 py-3.5 text-center text-xs text-slate-400">
    <p>🌸 馬卡龍風格迷因產生器 • 簡單輕鬆創作 🌸</p>
  </footer>
