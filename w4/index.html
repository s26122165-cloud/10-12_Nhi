<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>希臘許願池 - 朋友動態留言板</title>
  
  <!-- 引入 Google Fonts 與 FontAwesome 圖示庫 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* ==============================================
       1. 全局變數與風格重置 (Greek Aegean Theme)
       ============================================== */
    :root {
      --aegean-blue: #0b3c5d;
      --sky-blue: #328cc1;
      --sea-foam: #e0f2fe;
      --greek-gold: #d9b310;
      --gold-glow: rgba(217, 179, 16, 0.4);
      --marble-white: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.88);
      --text-dark: #1d2731;
      --font-title: 'Cinzel', 'Noto Serif TC', serif;
      --font-body: 'Noto Serif TC', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background: linear-gradient(180deg, #071e30 0%, #0b3c5d 45%, #1d5f8a 100%);
      min-height: 100vh;
      color: var(--text-dark);
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* 愛琴海閃爍光點與微光背景裝飾 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        radial-gradient(circle at 20% 20%, rgba(217, 179, 16, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(224, 242, 254, 0.12) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* ==============================================
       2. 頁頭許願池視覺 (Header)
       ============================================== */
    header {
      text-align: center;
      margin-bottom: 45px;
      color: var(--marble-white);
    }

    .fountain-icon-wrapper {
      font-size: 3.2rem;
      color: var(--greek-gold);
      margin-bottom: 12px;
      text-shadow: 0 0 20px var(--gold-glow);
      animation: float 3.5s ease-in-out infinite;
    }

    header h1 {
      font-family: var(--font-title);
      font-size: 2.6rem;
      letter-spacing: 3px;
      color: var(--marble-white);
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
      margin-bottom: 8px;
    }

    header p {
      font-size: 1.1rem;
      color: var(--sea-foam);
      opacity: 0.9;
    }

    .greek-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
    }
    .greek-divider::before, .greek-divider::after {
      content: "";
      height: 2px;
      width: 90px;
      background: linear-gradient(90deg, transparent, var(--greek-gold), transparent);
    }
    .greek-divider i {
      margin: 0 15px;
      color: var(--greek-gold);
      font-size: 1rem;
    }

    /* ==============================================
       3. 酷炫水波紋載入動畫 (Fountain Ripple Loader)
       ============================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 70px 0;
      color: var(--sea-foam);
    }

    .ripple-loader {
      position: relative;
      width: 90px;
      height: 90px;
      margin-bottom: 25px;
    }

    .ripple-loader div {
      position: absolute;
      border: 3px solid var(--greek-gold);
      opacity: 1;
      border-radius: 50%;
      animation: ripple 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }

    .ripple-loader div:nth-child(2) {
      animation-delay: -1s;
      border-color: var(--sea-foam);
    }

    @keyframes ripple {
      0% {
        top: 40px; left: 40px;
        width: 0; height: 0;
        opacity: 1;
      }
      100% {
        top: 0px; left: 0px;
        width: 80px; height: 80px;
        opacity: 0;
      }
    }

    .loading-text {
      font-family: var(--font-title);
      font-size: 1.25rem;
      letter-spacing: 3px;
      animation: pulseText 1.5s infinite alternate;
    }

    @keyframes pulseText {
      0% { opacity: 0.5; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    /* ==============================================
       4. 許願石板卡片區 (Message Cards Grid)
       ============================================== */
    #message-board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }

    .wish-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25),
                  inset 0 0 0 1px rgba(255, 255, 255, 0.6);
      position: relative;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .wish-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35),
                  0 0 18px var(--gold-glow);
      border-color: var(--greek-gold);
    }

    .card-header {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px dashed rgba(11, 60, 93, 0.2);
      padding-bottom: 12px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--sky-blue), var(--aegean-blue));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
      margin-right: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
      border: 2px solid var(--greek-gold);
      flex-shrink: 0;
    }

    .author-info {
      flex: 1;
      overflow: hidden;
    }

    .author-name {
      font-weight: 700;
      color: var(--aegean-blue);
      font-size: 1.1rem;
      line-height: 1.2;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }

    .wish-time {
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 3px;
    }

    .card-body {
      font-size: 0.98rem;
      line-height: 1.6;
      color: var(--text-dark);
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 16px;
      flex-grow: 1;
    }

    .card-footer {
      text-align: right;
      font-size: 0.8rem;
      color: var(--greek-gold);
      font-weight: 600;
    }

    .notice-box {
      grid-column: 1 / -1;
      background: var(--card-bg);
      padding: 35px;
      border-radius: 16px;
      text-align: center;
      color: var(--aegean-blue);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.9rem; }
      #message-board { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="fountain-icon-wrapper">
        <i class="fa-solid fa-coins"></i>
      </div>
      <h1>希臘許願池</h1>
      <p>投下一枚金幣，讓愛琴海的水波傳遞朋友間的悄悄話</p>
      
      <div class="greek-divider">
        <i class="fa-solid fa-crown"></i>
      </div>
    </header>

    <!-- 酷炫載入中水波動畫 -->
    <div id="loading">
      <div class="ripple-loader">
        <div></div>
        <div></div>
      </div>
      <div class="loading-text">讀取留言中...</div>
    </div>

    <!-- 留言板卡片呈現區 -->
    <main id="message-board" style="display: none;"></main>
  </div>

  <script>
    // 試算表 CSV 匯出網址
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/18joM6HHlNb9ojSSgLQR3ZYxV_pJwoTJXgaiUXMmZvDA/export?format=csv';

    document.addEventListener('DOMContentLoaded', () => {
      fetchWishMessages();
    });

    /**
     * 使用 fetch 取得 CSV 資料並轉換為陣列
     */
    async function fetchWishMessages() {
      const loadingEl = document.getElementById('loading');
      const boardEl = document.getElementById('message-board');

      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) {
          throw new Error(`HTTP 錯誤！狀態碼: ${response.status}`);
        }
        
        const csvText = await response.text();
        
        // 解析 CSV（正確處理引號與逗號）
        const parsedData = parseCSV(csvText);

        // 跳過表頭 (第一行)，將資料整理成物件陣列：[時間戳記, 名字, 悄悄話]
        const messages = parsedData.slice(1).map(row => ({
          timestamp: row[0] ? row[0].trim() : '',
          name: row[1] ? row[1].trim() : '無名許願者',
          message: row[2] ? row[2].trim() : ''
        })).filter(item => item.message !== '' || item.name !== ''); // 過濾空行

        // 隱藏載入動畫，顯示留言板
        loadingEl.style.display = 'none';
        boardEl.style.display = 'grid';

        renderMessages(messages);

      } catch (error) {
        console.error('Fetch Error:', error);
        loadingEl.innerHTML = `
          <div class="notice-box">
            <i class="fa-solid fa-triangle-exclamation" style="font-size:2rem; color:#e74c3c; margin-bottom:10px;"></i>
            <h3>無法讀取許願池留言</h3>
            <p style="margin-top:8px; font-size:0.95rem;">請確認試算表已開啟「知道連結的人皆可查看」共用權限。</p>
          </div>
        `;
      }
    }

    /**
     * CSV 狀態機解析器：完美處理留言內容包含逗號、引號或換行的情況
     */
    function parseCSV(text) {
      const result = [];
      let row = [];
      let cur = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"') {
          if (inQuotes && next === '"') { // 處理雙引號轉義 ("")
            cur += '"';
            i++;
          } else { // 切換引號狀態
            inQuotes = !inQuotes;
          }
        } else if (c === ',' && !inQuotes) { // 非引號內的逗號 -> 切換欄位
          row.push(cur);
          cur = '';
        } else if ((c === '\r' || c === '\n') && !inQuotes) { // 非引號內的換行 -> 切換列
          if (c === '\r' && next === '\n') i++;
          row.push(cur);
          cur = '';
          if (row.some(f => f.length > 0)) result.push(row);
          row = [];
        } else {
          cur += c;
        }
      }

      if (cur.length > 0 || row.length > 0) {
        row.push(cur);
        result.push(row);
      }

      return result;
    }

    /**
     * 渲染留言卡片至 DOM
     */
    function renderMessages(messages) {
      const boardEl = document.getElementById('message-board');

      if (messages.length === 0) {
        boardEl.innerHTML = `
          <div class="notice-box">
            <i class="fa-regular fa-paper-plane" style="font-size:2rem; margin-bottom:10px;"></i>
            <p>許願池目前還沒有悄悄話，快成為第一個投下金幣的人吧！</p>
          </div>
        `;
        return;
      }

      // 將最新的留言顯示在最上面 (Reverse 倒序)
      const htmlContent = messages.reverse().map(item => {
        const safeName = escapeHTML(item.name);
        const safeMessage = escapeHTML(item.message);
        const safeTime = escapeHTML(item.timestamp);
        const firstChar = safeName.charAt(0).toUpperCase() || '希';

        return `
          <article class="wish-card">
            <div class="card-header">
              <div class="avatar">${firstChar}</div>
              <div class="author-info">
                <div class="author-name">${safeName}</div>
                <div class="wish-time"><i class="fa-regular fa-clock"></i> ${safeTime}</div>
              </div>
            </div>
            <div class="card-body">${safeMessage}</div>
            <div class="card-footer">
              <i class="fa-solid fa-water"></i> Aegean Wish
            </div>
          </article>
        `;
      }).join('');

      boardEl.innerHTML = htmlContent;
    }

    /**
     * XSS 防範：轉義字串中的特殊字元
     */
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
